
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三宅杯 QR受付</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f7;color:#17324d;font-family:system-ui,"Noto Sans JP",sans-serif}
header{background:#17324d;color:white;padding:18px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:650px;margin:auto;padding:16px}
.panel{background:white;border-radius:16px;padding:20px;margin-bottom:15px}
h2{text-align:center}
button{width:100%;padding:17px;margin:8px 0;border:0;border-radius:12px;background:#087e85;color:white;font-size:20px;font-weight:bold}
button:disabled{opacity:.5}
#reader{width:100%;margin:auto}
#message{padding:20px;border-radius:12px;text-align:center;font-size:22px;font-weight:bold;background:#eef3f7}
small{display:block;text-align:center;color:#657789;margin-top:12px}
</style>
</head>
<body>
<header>三宅杯｜QRコード受付</header>
<main>
<section class="panel">
<h2>QRコードをかざしてください</h2>
<div id="reader"></div>
<button id="start" onclick="startCamera()">内側カメラを起動</button>
<button onclick="stopCamera()" style="background:#607183">カメラを停止</button>
</section>
<section class="panel">
<div id="message">カメラを起動してください</div>
<small>連続読み取り確認用・受付登録はまだ行いません</small>
</section>
</main>
<script>
let scanner=null;
let busy=false;
let lastValue="";
let lastTime=0;

async function startCamera(){
 if(scanner)return;
 if(typeof Html5Qrcode==="undefined"){
  show("読み取り機能を読み込めませんでした",false);
  return;
 }
 const btn=document.getElementById("start");
 btn.disabled=true;
 try{
  scanner=new Html5Qrcode("reader");
  await scanner.start(
   {facingMode:"user"},
   {fps:10,qrbox:{width:240,height:240}},
   onRead,
   ()=>{}
  );
  show("QRコードをかざしてください",true);
 }catch(e){
  scanner=null;
  btn.disabled=false;
  show("カメラを起動できませんでした："+e.message,false);
 }
}

function onRead(value){
 const now=Date.now();
 if(busy||(value===lastValue&&now-lastTime<4000))return;
 busy=true;
 lastValue=value;
 lastTime=now;
 show("QRコードを読み取りました",true);
 setTimeout(()=>{
  busy=false;
  show("次のQRコードをかざしてください",true);
 },2000);
}

async function stopCamera(){
 if(scanner){
  try{await scanner.stop();}catch(e){}
  try{scanner.clear();}catch(e){}
  scanner=null;
 }
 document.getElementById("start").disabled=false;
 show("カメラを停止しました",false);
}

function show(text,ok){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.background=ok?"#d9f4e8":"#ffe0de";
 el.style.color=ok?"#075b37":"#9e2d25";
}
</script>
</body>
</html>
